name: Resultatenwacht

on:
  # GitHub voert geplande runs met veel vertraging uit en laat er soms hele
  # reeksen vallen. Daarom kijkt planning.py niet of het nu precies MELD_UUR
  # is, maar of het laatste geplande moment voorbij is en nog niet verwerkt
  # werd. Een run die te laat start, pakt een gemist moment zo alsnog op.
  # Minuut 17 in plaats van 0: op het hele uur is het bij GitHub het drukst.
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      seed:
        description: "Alleen opslaan wat er nu staat, zonder te mailen"
        type: boolean
        default: false
      meld_alles:
        description: "Ook mailen als state.json leeg is (alles geldt dan als nieuw)"
        type: boolean
        default: false

concurrency:
  group: resultatenwacht
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is het ingestelde moment aan de beurt?
        id: tijd
        run: >
          python3 planning.py controleer
          --taak resultaten
          --uren "${{ vars.MELD_UUR || '16' }}"
          --dagen "${{ vars.MELD_DAGEN || '1,2,3,4,5,6,7' }}"
          --tijdzone "${{ vars.TIJDZONE || 'Europe/Brussels' }}"
          --state state.json
          ${{ github.event_name != 'schedule' && '--handmatig' || '' }}

      - uses: actions/setup-python@v5
        if: steps.tijd.outputs.draaien == 'ja'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.tijd.outputs.draaien == 'ja'

      - name: Controleren op nieuwe resultaten
        id: controle
        if: steps.tijd.outputs.draaien == 'ja'
        env:
          # Login op het ouderportaal
          A4L_EMAIL: ${{ secrets.A4L_EMAIL }}
          A4L_PASSWORD: ${{ secrets.A4L_PASSWORD }}
          A4L_SCHOOL_ID: ${{ vars.A4L_SCHOOL_ID || 'lab_sn' }}
          A4L_SCHOOL_CODE: ${{ vars.A4L_SCHOOL_CODE }}
          A4L_LEERLINGEN: ${{ vars.A4L_LEERLINGEN }}
          A4L_VOLG_RAPPORTEN: ${{ vars.A4L_VOLG_RAPPORTEN || '1' }}
          # Verzenden van de mail
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAAM: ${{ vars.MAIL_FROM_NAAM || 'Resultatenwacht' }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Een foutmail enkel bij de eerste poging voor een moment; de
          # herkansingen in de uren daarna mailen niet opnieuw.
          MAIL_BIJ_FOUT: ${{ steps.tijd.outputs.eerste_poging == 'ja' && (vars.MAIL_BIJ_FOUT || '1') || '0' }}
          # Overig
          STATE_FILE: state.json
          TZ: ${{ vars.TIJDZONE || 'Europe/Brussels' }}
        run: >
          python watcher.py
          ${{ inputs.seed && '--seed' || '' }}
          ${{ inputs.meld_alles && '--meld-alles' || '' }}

      - name: Moment als verwerkt noteren
        if: always() && steps.tijd.outputs.draaien == 'ja'
        run: >
          python3 planning.py markeer
          --taak resultaten
          --state state.json
          --moment "${{ steps.tijd.outputs.moment }}"
          --gelukt "${{ steps.controle.outcome == 'success' }}"

      - name: Stand van zaken bewaren
        if: always() && steps.tijd.outputs.draaien == 'ja'
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: bijwerken na controle"
            git pull --rebase --quiet
            git push
          fi
