name: Kalendersync

on:
  # Zelfde aanpak als de Resultatenwacht: planning.py beslist of het moment
  # van KALENDER_UUR voorbij is en nog niet verwerkt werd, zodat een te laat
  # gestarte of weggevallen run het moment niet laat verloren gaan.
  # Minuut 43, zodat deze run niet tegelijk met de Resultatenwacht pusht.
  schedule:
    - cron: "43 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen tonen wat er zou veranderen, niets wegschrijven"
        type: boolean
        default: false

concurrency:
  group: kalendersync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synchroniseren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is het ingestelde moment aan de beurt?
        id: tijd
        run: >
          python3 planning.py controleer
          --taak kalender
          --uren "${{ vars.KALENDER_UUR || '6' }}"
          --dagen "1,2,3,4,5,6,7"
          --tijdzone "${{ vars.TIJDZONE || 'Europe/Brussels' }}"
          --state kalender_state.json
          ${{ github.event_name != 'schedule' && '--handmatig' || '' }}

      - uses: actions/setup-python@v5
        if: steps.tijd.outputs.draaien == 'ja'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-agenda.txt
        if: steps.tijd.outputs.draaien == 'ja'

      - name: Kalender synchroniseren
        id: sync
        if: steps.tijd.outputs.draaien == 'ja'
        env:
          A4L_EMAIL: ${{ secrets.A4L_EMAIL }}
          A4L_PASSWORD: ${{ secrets.A4L_PASSWORD }}
          A4L_SCHOOL_ID: ${{ vars.A4L_SCHOOL_ID || 'lab_sn' }}
          A4L_SCHOOL_CODE: ${{ vars.A4L_SCHOOL_CODE }}
          A4L_LEERLINGEN: ${{ vars.A4L_LEERLINGEN }}
          KALENDER_SOORTEN: ${{ vars.KALENDER_SOORTEN || 'labAThome,lesvrij,evaluatie,uitstap' }}
          KALENDER_SCHOOLBREED: ${{ vars.KALENDER_SCHOOLBREED || '1' }}
          KALENDER_NAAM_IN_TITEL: ${{ vars.KALENDER_NAAM_IN_TITEL || '1' }}
          KALENDER_OPRUIMEN: ${{ vars.KALENDER_OPRUIMEN || '1' }}
          KALENDER_SCHOOLJAAR: ${{ vars.KALENDER_SCHOOLJAAR }}
          GOOGLE_AGENDA_ID: ${{ secrets.GOOGLE_AGENDA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TZ: ${{ vars.TIJDZONE || 'Europe/Brussels' }}
        run: python kalender.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Een dry-run telt niet als verwerkt: er is niets weggeschreven.
      - name: Moment als verwerkt noteren
        if: always() && steps.tijd.outputs.draaien == 'ja' && inputs.dry_run != true
        run: >
          python3 planning.py markeer
          --taak kalender
          --state kalender_state.json
          --moment "${{ steps.tijd.outputs.moment }}"
          --gelukt "${{ steps.sync.outcome == 'success' }}"

      - name: Stand van zaken bewaren
        if: always() && steps.tijd.outputs.draaien == 'ja' && inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain kalender_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kalender_state.json
            git commit -m "state: kalendersync bijgewerkt"
            git pull --rebase --quiet
            git push
          fi
